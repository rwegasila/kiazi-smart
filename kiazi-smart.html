async function handleAvatarChange(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Chagua faili la picha.', true); return; }
  if(file.size > 3*1024*1024){ showToast('Picha ni kubwa mno (zaidi ya 3MB).', true); return; }
  try{
    const dataUrl = await fileToDataURL(file);
    const email = currentEmail();
    const stored = await LS.get('user:'+email);
    if(stored){ stored.photo = dataUrl; await LS.set('user:'+email, stored); }
    state.user = { ...state.user, photo: dataUrl };
    showToast('Picha ya wasifu imesasishwa.');
    render();
  }catch(e){ showToast(e.message||'Imeshindwa kupakia picha.', true); }
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Imeshindwa kusoma picha. Jaribu tena.'));
    reader.readAsDataURL(file);
  });
}
/* Picha halisi ya shamba - mkulima anaweza kupakia picha yake mwenyewe ya
   shamba/zao (badala ya kutegemea picha za mfano tu), inaonekana kwenye
   orodha ya mashamba na juu ya ukurasa wa shamba husika. */
async function updateFarmPhoto(farmId, file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Chagua faili la picha.', true); return; }
  if(file.size > 4*1024*1024){ showToast('Picha ni kubwa mno (zaidi ya 4MB).', true); return; }
  try{
    const dataUrl = await fileToDataURL(file);
    const farm = state.farms.find(f=>f.id===farmId);
    if(farm) farm.photo = dataUrl;
    try{
      const stored = await LS.get('farm:'+farmId);
      if(stored){ stored.photo = dataUrl; await LS.set('farm:'+farmId, stored); }
    }catch(e){}
    showToast('Picha ya shamba imesasishwa.');
    render();
  }catch(e){ showToast(e.message||'Imeshindwa kupakia picha.', true); }
}

/* ======================================================================
   ROOT RENDER
   ====================================================================== */
function render(){
  const root = document.getElementById('app');
  let html = '';
  if(state.screen==='auth'){
    html = renderAuth();
  } else {
    if(state.tab==='dashboard') html = renderDashboard();
    else if(state.tab==='farms') html = renderFarms();
    else if(state.tab==='scan') html = renderScan();
    else if(state.tab==='market') html = renderMarket();
    else if(state.tab==='profile') html = renderProfile();
    else if(state.tab==='admin') html = renderAdmin();
  }
  root.innerHTML = html;
  mountCharts();
}

/* ======================================================================
   CHATI (Chart.js) - inaunganishwa baada ya kila render() kulingana na
   canvas zilizopo kwenye skrini ya sasa.
   ====================================================================== */
/* Majina mafupi ya siku (Kiswahili) - yanatumika badala ya
   toLocaleDateString('sw',...) kwa sababu baadhi ya vivinjari/vifaa
   havina data kamili ya lugha ya Kiswahili (ICU), hivyo hurudisha
   jina lisiloeleweka badala ya siku sahihi. Ramani hii ni ya uhakika
   kila wakati, bila kutegemea mfumo wa kivinjari. */
const SHORT_DAYS_SW = ['Jpi','Jtat','Jnne','Jtan','Alh','Iju','Jmo'];
const MONTHS_SW = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ago','Sep','Okt','Nov','Des'];
/* Uumbizaji wa tarehe/muda kwa Kiswahili bila kutegemea locale ya
   kivinjari (angalia maelezo hapo juu). fmtDate: "12 Jan 2026".
   fmtDateTime: inaongeza saa "14:05". */
function fmtDate(d){ const dt=(d instanceof Date)?d:new Date(d); if(isNaN(dt)) return ''; return `${dt.getDate()} ${MONTHS_SW[dt.getMonth()]} ${dt.getFullYear()}`; }
function fmtDateTime(d){ const dt=(d instanceof Date)?d:new Date(d); if(isNaN(dt)) return ''; const hh=String(dt.getHours()).padStart(2,'0'), mm=String(dt.getMinutes()).padStart(2,'0'); return `${fmtDate(dt)} · ${hh}:${mm}`; }
function mountCharts(){
  if(typeof Chart === 'undefined') return; // CDN bado haijapakia / hakuna mtandao

  // 1) Utabiri wa hali ya hewa (siku 5) - joto la juu/chini na mvua
  if(document.getElementById('chart-weather-forecast') && state.weather.data){
    const daily = state.weather.data.raw.daily;
    const labels = daily.time.map((d,i)=> i===0?'Leo':SHORT_DAYS_SW[new Date(d+'T00:00:00').getDay()]);
    mountChart('chart-weather-forecast', {
      type:'bar',
      data:{ labels, datasets:[
        { type:'line', label:'Joto la juu (°C)', data:daily.temperature_2m_max, borderColor:'#B87A2E', backgroundColor:'#B87A2E', tension:.35, yAxisID:'y' },
        { label:'Mvua (mm)', data:daily.precipitation_sum, backgroundColor:'#3E7CA688', yAxisID:'y1' },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:true, labels:{ boxWidth:10, font:{size:10} } } },
        scales:{
          y:{ position:'left', ticks:{font:{size:9}} },
          y1:{ position:'right', grid:{drawOnChartArea:false}, ticks:{font:{size:9}} },
          x:{ ticks:{font:{size:9}} },
        }
      }
    });
  }

  // 2) Bei wastani ya viazi kwa mkoa (kutoka matangazo halisi ya sokoni)
  if(document.getElementById('chart-market-prices')){
    const avg = marketAvgPriceByRegion(state.market.listings);
    if(avg.length){
      mountChart('chart-market-prices', {
        type:'bar',
        data:{ labels: avg.map(a=>a.region), datasets:[
          { label:'Bei Wastani (TZS/kg)', data: avg.map(a=>a.avg), backgroundColor:'#3C6B35' }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
          plugins:{ legend:{ display:false } },
          scales:{ x:{ ticks:{font:{size:9}} }, y:{ ticks:{font:{size:10}} } }
        }
      });
    }
  }

  // 4) Bajeti: Mpango (mauzo/gharama) dhidi ya gharama halisi tayari zilizotumika
  if(document.getElementById('chart-budget-compare')){
    const fid = state.activeFarmId;
    const b = fid && state.budgets[fid];
    const summary = fid && state.expensesSummary[fid];
    if(b){
      const plannedRevenue = Number(b.planned_harvest_kg||0) * Number(b.planned_price_per_kg||0);
      const plannedCost = (b.planned_costs||[]).reduce((s,c)=>s+Number(c.amount||0),0);
      const actualCost = (summary && summary.total_expenses) || 0;
      mountChart('chart-budget-compare', {
        type:'bar',
        data:{ labels:['Mauzo Yanayotarajiwa','Gharama za Mpango','Gharama Halisi (sasa)'], datasets:[
          { label:'TZS', data:[plannedRevenue, plannedCost, actualCost], backgroundColor:['#3E7CA6','#B87A2E','#9B3B26'] }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
          plugins:{ legend:{ display:false } },
          scales:{ x:{ ticks:{font:{size:9}} }, y:{ ticks:{font:{size:10}} } }
        }
      });
    }
  }

  // 5) Dashboard: muhtasari wa fedha wa mashamba YOTE (mauzo/gharama/faida)
  if(document.getElementById('chart-dash-finance')){
    const fin = financeOverview();
    if(fin.plannedRevenue||fin.plannedCost||fin.actualCost){
      mountChart('chart-dash-finance', {
        type:'bar',
        data:{ labels:['Mauzo Yanayotarajiwa','Gharama za Mpango','Gharama Halisi','Faida Inayotarajiwa'], datasets:[
          { label:'TZS', data:[fin.plannedRevenue, fin.plannedCost, fin.actualCost, fin.projectedProfit], backgroundColor:['#3E7CA6','#B87A2E','#9B3B26','#3C6B35'] }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
          plugins:{ legend:{ display:false } },
          scales:{ x:{ ticks:{font:{size:9}} }, y:{ ticks:{font:{size:10}} } }
        }
      });
    }
  }
}

async function boot(){
  try{ state.lang=localStorage.getItem('kiazi_lang')||state._langMem||'sw'; }catch(e){ state.lang=state._langMem||'sw'; }
  try{ await ensureDemoAccounts(); }catch(e){}
  try{
    const saved = await LS.get('config:aiBackendUrl');
    if(saved) state.aiBackendUrl = saved;
  }catch(e){}
  document.documentElement.lang=state.lang; document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  render();
}
boot();

/* Sajili Service Worker (PWA) - inafanya app iweze "kusakinishwa" kama
   app halisi na kufunguka haraka bila mtandao. Imezungushwa na try/catch
   na uangalizi wa 'https:'/'localhost' kwa sababu Service Workers
   hazifanyi kazi kwenye 'file://' wala ndani ya baadhi ya mazingira ya
   iframe yaliyofungwa (mfano hapa ndani ya Claude) - katika hali hizo
   app inaendelea kufanya kazi kawaida, bila tu uwezo wa "install/offline".*/
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* si tatizo - endelea bila SW */ });
  });
}
