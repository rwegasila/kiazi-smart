*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* Default salama kwa ikoni zote (SVG) — bila hii, ikoni zilizowekwa moja kwa
   moja ndani ya vitufe/vichwa vya habari (bila kifuko maalum kama .icon-btn
   au .list-ico) hazikuwa na kipimo, hivyo kivinjari kilizionyesha kwa
   ukubwa wa kawaida (mkubwa mno), na kufanya vitufe kuonekana vikubwa
   visivyo na umbo sahihi. Madarasa mahususi (.icon-btn svg, .list-ico svg,
   n.k) yana kipimo chake maalum na yataendelea kushinda kanuni hii ya jumla. */
svg{width:20px;height:20px;flex-shrink:0;}
.btn svg{width:18px;height:18px;}
.badge svg,.risk-pill svg,.ai-badge svg,.tabchip svg{width:12px;height:12px;}
.list-end svg,.list-sub svg{width:13px;height:13px;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(60,107,53,.10), transparent 40%),
    radial-gradient(circle at 88% 92%, rgba(184,122,46,.12), transparent 42%);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--primary-tint);color:var(--primary-dark);}

/* ============================= APP SHELL =============================
   Kwenye simu: app inajaza skrini nzima. Kwenye kompyuta: app HAIONEKANI
   kama "mfano wa simu" tena - badala yake inaonekana kama programu ya
   kawaida ya wavuti (web app) yenye menyu ya pembeni (sidebar) na eneo
   pana la maudhui, kama app halisi za kompyuta zenye ubunifu wa kisasa. */
.app-outer{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:stretch;
  justify-content:center;
}
.app-shell{
  flex:1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  background:var(--screen);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  min-width:0;
  position:relative;
  overflow-x:hidden;
}

/* ============================= TOP BAR ============================= */
.topbar{
  flex:none;
  padding:34px 20px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.topbar .brand{display:flex;align-items:center;gap:8px;}
.topbar .brand svg{width:22px;height:22px;}
.topbar .brand span{font-family:var(--font-display);font-weight:600;font-size:17px;}
/* ============================= BRAND LOCKUP ============================= */
/* "Kiazi Smart" iliyodesigniwa: "Kiazi" kwa rangi ya ink (nzito, serif),
   "Smart" kwa rangi ya accent (mwanga kidogo, italiki), na tagline ndogo
   ya hiari chini - hutumika kila mahali badala ya <span>Kiazi Smart</span>
   ya kawaida ili jina la app lionekane kwa muonekano wa kipekee. */
.brand-lockup{display:flex;align-items:center;gap:9px;line-height:1.05;}
.brand-lockup .bl-name{font-family:var(--font-display);font-weight:700;letter-spacing:-.2px;}
.brand-lockup .bl-name b{color:var(--ink);font-weight:700;}
.brand-lockup .bl-name i{color:var(--primary);font-style:italic;font-weight:600;}
.brand-lockup .bl-tag{display:block;font-family:var(--font-body);font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px;}
.brand-lockup.lg .bl-name{font-size:24px;}
.brand-lockup.md .bl-name{font-size:17px;}
.brand-lockup.sm .bl-name{font-size:15px;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--card-border);
  background:var(--card);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:var(--ink);
  flex:none;
}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:17px;height:17px;}


/* ============================================================
   KIAZI SMART — PREMIUM ROLE AVATARS
   Kila account ina default avatar yenye identity yake.
   Picha ya mtumiaji ikipakiwa bado ina priority.
   ============================================================ */
.role-avatar{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  overflow:hidden;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.92);
  box-shadow:0 7px 18px -8px rgba(34,48,28,.45);
  background:linear-gradient(145deg,#3C6B35,#B87A2E);
}
.role-avatar::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
  pointer-events:none;
}
.role-avatar svg{
  width:100%;
  height:100%;
  display:block;
}
.role-avatar-fallback{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:.02em;
}
.role-avatar-fallback .role-symbol{
  font-size:.48em;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));
}
.role-avatar-fallback .role-initials{
  position:absolute;
  bottom:8%;
  font-family:var(--font-body);
  font-size:.22em;
  letter-spacing:.08em;
  background:rgba(20,35,17,.52);
  padding:.22em .52em;
  border-radius:999px;
  backdrop-filter:blur(4px);
}
.topbar .avatar-wrap{
  width:34px;
  height:34px;
}
.avatar-upload .role-avatar{
  width:60px;
  height:60px;
}
.account-identity{
  display:flex;
  align-items:center;
  gap:10px;
}
.account-identity .role-avatar{
  width:42px;
  height:42px;
}

/* ============================= AVATAR UPLOAD ============================= */
.avatar-upload{position:relative;flex:none;cursor:pointer;border-radius:50%;}
.avatar-edit-badge{
  position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;
  background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--card);
}
.avatar-edit-badge svg{width:11px;height:11px;}

/* ============================= SCROLL AREA ============================= */
.scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:2px 20px 100px;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none;}

/* ============================= BOTTOM NAV ============================= */
.bottomnav{
  flex:none;
  display:flex;
  padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(251,248,240,.92);
  backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
  position:relative;
  z-index:40;
}
.navbtn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;
  padding:6px 2px;
  color:var(--ink-faint);
  border-radius:14px;
}
.navbtn svg{width:21px;height:21px;}
.navbtn span{font-size:10.5px;font-weight:600;}
.navbtn.active{color:var(--primary);}
.navbtn.active .navdot{display:block;}
.navdot{display:none;width:4px;height:4px;border-radius:50%;background:var(--primary);margin-top:-2px;}

/* ============================= TYPE ============================= */
.h1{font-family:var(--font-display);font-weight:600;font-size:25px;line-height:1.2;margin:14px 0 4px;color:var(--ink);}
.h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.25;margin:0 0 2px;color:var(--ink);}
.eyebrow{font-size:13px;color:var(--ink-faint);margin:0 0 2px;}
.muted{color:var(--ink-soft);font-size:13.5px;line-height:1.55;}
.tiny{font-size:11.5px;color:var(--ink-faint);}

/* ============================= CARD ============================= */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);
  padding:16px;
}
.card + .card{margin-top:12px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
/* Dashboard 2-column layout wrapper: on mobile these collapse (display:contents)
   so content stacks exactly as before; on desktop they become real grid columns
   (see DESKTOP LAYOUT section) so widgets don't stretch into oversized single-column blocks. */
.dash-grid{display:block;}
.dash-aside,.dash-main{display:contents;}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;
  border-radius:999px;
  font-weight:600;
  font-size:14.5px;
  padding:13px 20px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--primary-tint);color:var(--primary-dark);}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--card-border);}
.btn-danger{background:var(--danger-tint);color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;}
.btn[disabled]{opacity:.55;pointer-events:none;}
.fab{
  position:absolute;right:20px;bottom:22px;
  width:54px;height:54px;border-radius:50%;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 22px -8px rgba(37,64,31,.55);
  border:none;cursor:pointer;z-index:30;
}
.fab svg{width:22px;height:22px;}
.fab:active{transform:scale(.93);}

/* ============================= FORM ============================= */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:5px;}
.input, select.input, textarea.input{
  width:100%;
  border:1.5px solid var(--card-border);
  background:var(--screen);
  border-radius:var(--radius-s);
  padding:12px 13px;
  font-size:14.5px;
  color:var(--ink);
  outline:none;
}
.input:focus, select.input:focus, textarea.input:focus{border-color:var(--primary);}
textarea.input{resize:vertical;min-height:64px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{
  display:flex;background:var(--grey-tint);padding:3px;border-radius:999px;gap:2px;
}
.seg button{
  flex:1;border:none;background:transparent;padding:9px 8px;border-radius:999px;
  font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;
}
.seg button.active{background:var(--card);color:var(--primary-dark);box-shadow:0 1px 4px rgba(34,48,28,.16);}

.tabbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tabchip{
  flex:none;border:1.5px solid var(--card-border);background:var(--card);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.tabchip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ============================= BADGES ============================= */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;}
.badge-primary{background:var(--primary-tint);color:var(--primary-dark);}
.badge-accent{background:var(--accent-tint);color:#8A5A1F;}
.badge-danger{background:var(--danger-tint);color:var(--danger);}
.badge-grey{background:var(--grey-tint);color:var(--ink-soft);}
.badge-info{background:var(--info-tint);color:#265877;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ============================= STAT ROW ============================= */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin:14px 0;}
.stat-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-m);
  padding:14px;
}
.stat-num{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--ink);}
.stat-label{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* ============================= LISTS ============================= */
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.list-item:last-child{border-bottom:none;}
.list-ico{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-tint);color:var(--primary-dark);
}
.list-ico svg{width:18px;height:18px;}
.list-main{flex:1;min-width:0;}
.list-title{font-weight:600;font-size:14px;color:var(--ink);}
.list-sub{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}
.list-end{font-size:13px;font-weight:600;color:var(--ink-soft);flex:none;text-align:right;}

/* ============================= EMPTY STATE ============================= */
.empty{
  text-align:center;padding:40px 12px;
}
.empty svg{width:44px;height:44px;color:var(--grey);margin-bottom:12px;}
.empty h3{font-family:var(--font-display);font-size:17px;margin:0 0 6px;}
.empty p{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

/* ============================= AUTH SCREEN ============================= */
.auth-hero{
  padding:0 0 10px;
  display:flex;flex-direction:column;align-items:stretch;
}
.auth-cover-photo{width:100%;height:290px;overflow:hidden;position:relative;background:#e8eee3;border-radius:0 0 28px 28px;box-shadow:0 16px 38px -24px rgba(34,48,28,.5);}
.auth-brand-overlay{
  position:absolute;left:14px;bottom:14px;top:auto;z-index:2;
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 14px 9px 11px;
  background:rgba(15,26,12,.42);
  -webkit-backdrop-filter:blur(10px) saturate(1.3);
  backdrop-filter:blur(10px) saturate(1.3);
  border:1px solid rgba(255,255,255,.16);
  border-radius:16px;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.55);
}
.auth-brand-overlay .bl-name b{color:#fff;}
.auth-brand-overlay .bl-name i{color:#B7E39A;}
.auth-brand-overlay .bl-tag{color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(0,0,0,.35);}
.auth-cover-photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 52%;filter:saturate(1.06) contrast(1.03);}
.auth-cover-photo img:hover{transform:scale(1.02);}
.auth-copy{padding:18px 20px 4px;}
.auth-mark{display:flex;align-items:center;gap:9px;margin-bottom:22px;}
.auth-mark svg{width:26px;height:26px;}
.auth-mark span{font-family:var(--font-display);font-weight:600;font-size:18px;}
.auth-leaf{
  width:100%;height:150px;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;border-radius:var(--radius-m);overflow:hidden;
}
.auth-leaf svg{width:100%;height:100%;display:block;}
.auth-title{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.2;margin:8px 0 4px;}
.auth-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

/* ============================= BOTTOM SHEET ============================= */
.sheet-overlay{
  position:absolute;inset:0;background:rgba(22,19,16,.42);
  z-index:60;
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;
  max-height:82%;
  background:var(--screen);
  border-radius:26px 26px 0 0;
  box-shadow:var(--shadow-sheet);
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.8,.25,1);
  display:flex;flex-direction:column;
}
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet-grab{width:38px;height:4px;background:var(--card-border);border-radius:4px;margin:8px auto 14px;flex:none;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex:none;}
.sheet-head h3{font-family:var(--font-display);font-size:18px;margin:0;}
.sheet-body{overflow-y:auto;flex:1;padding-bottom:4px;}

/* ============================= TOAST ============================= */
.toast{
  position:absolute;left:20px;right:20px;bottom:92px;z-index:80;
  background:var(--ink);color:#fff;
  padding:12px 16px;border-radius:14px;font-size:13px;font-weight:500;
  box-shadow:0 12px 24px -10px rgba(0,0,0,.4);
  opacity:0;transform:translateY(8px);
  transition:all .2s ease;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{background:var(--danger);}
.toast svg{width:16px;height:16px;flex:none;}

/* ============================= SCAN RESULT ============================= */
.result-hero{
  border-radius:var(--radius-m);
  padding:22px 18px;
  text-align:center;
  margin-bottom:14px;
}
.result-hero.healthy{background:var(--primary-tint);}
.result-hero.warn{background:var(--accent-tint);}
.result-hero.danger{background:var(--danger-tint);}
.result-hero.grey{background:var(--grey-tint);}
.result-hero svg{width:40px;height:40px;margin-bottom:8px;}
.result-hero .rtitle{font-family:var(--font-display);font-weight:600;font-size:19px;margin-bottom:3px;}
.result-hero .rconf{font-size:13px;color:var(--ink-soft);}
.ai-badge{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;}
.ai-badge.live{background:var(--primary);color:#fff;}
.ai-badge.demo{background:var(--grey-tint);color:var(--ink-soft);}
.weather-card{background:linear-gradient(135deg,var(--info-tint),var(--card));border:1px solid var(--card-border);border-radius:var(--radius-m);padding:16px;margin-top:14px;box-shadow:var(--shadow-card);}
.weather-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.weather-temp{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1;}
.weather-select{border:1px solid var(--card-border);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink);}
.risk-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:8px;}
.risk-pill.healthy{background:var(--primary-tint);color:var(--primary-dark);}
.risk-pill.warn{background:var(--accent-tint);color:#7a4a12;}
.risk-pill.danger{background:var(--danger-tint);color:var(--danger);}
.forecast-row{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;}
.forecast-day{flex:none;min-width:56px;text-align:center;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:8px 6px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,background .15s ease;}
.forecast-day:active{transform:scale(.96);}
.forecast-day.selected{border:1.5px solid var(--primary);background:var(--primary-tint);}
.forecast-day.selected .fd-name{color:var(--primary-dark);}
.farm-advice-box{margin-top:12px;padding:12px 14px;background:var(--accent-tint);border-radius:var(--radius-m);border:1px solid rgba(184,122,46,.25);}
.farm-advice-box .fa-title{font-size:12.5px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.forecast-day .fd-name{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.forecast-day .fd-icon{font-size:18px;margin:4px 0;}
.forecast-day .fd-temp{font-size:11.5px;font-weight:700;}
.chart-wrap{position:relative;height:150px;margin-top:12px;}
.hero-photo{width:100%;border-radius:var(--radius-m);overflow:hidden;position:relative;box-shadow:var(--shadow-card);margin-bottom:22px;background:linear-gradient(155deg,var(--accent-tint),var(--primary-tint));}
.hero-photo img{width:100%;height:170px;object-fit:cover;display:block;}
.hero-photo .hp-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(0deg,rgba(20,24,15,.78),transparent);color:#fff;font-size:11px;line-height:1.4;}
.hero-photo svg{width:100%;height:170px;display:block;}
.hero-photo-editable{position:relative;}
.hp-edit-btn{
  position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(20,24,15,.55);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
}
.hp-edit-btn svg{width:16px;height:16px;}
.hp-edit-btn:active{transform:scale(.93);}

/* ============================= DASHBOARD PHOTO BANNER ============================= */
.photo-banner{width:100%;border-radius:var(--radius-l);overflow:hidden;position:relative;box-shadow:var(--shadow-card);margin:14px 0 18px;background:linear-gradient(155deg,var(--accent-tint),var(--primary-tint));}
.photo-banner img{width:100%;height:230px;object-fit:cover;object-position:center 58%;display:block;filter:saturate(1.04) contrast(1.02);transform:scale(1.01);transition:transform .45s ease,filter .3s ease;}
.photo-banner:hover img{transform:scale(1.035);filter:saturate(1.08) contrast(1.03);}
.photo-banner.role-visual{border:1px solid rgba(60,107,53,.16);background:#eef3e8;}

/* ============================= FARMER STORIES (photo gallery) ============================= */
.story-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;}

.farmer-showcase-card b{display:block;font-size:12px;}
.farmer-showcase-card span{display:block;font-size:10.5px;opacity:.88;margin-top:2px;}

.role-mini-card .rmi{font-size:22px;}

.role-mini-card span{display:block;color:var(--ink-faint);font-size:11px;line-height:1.4;margin-top:3px;}
.scan-auto{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-top:10px;border-radius:14px;background:var(--primary-tint);color:var(--primary-dark);font-size:12px;font-weight:600;}

@media(max-width:700px){.farmer-showcase{grid-template-columns:1fr;}.farmer-showcase-card img{height:190px;}.role-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}


/* ============================= SHAJARA (activity) PHOTOS ============================= */
.act-thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;cursor:zoom-in;}

.market-listing{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-m);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-card);}

.note-box svg{width:16px;height:16px;flex:none;margin-top:1px;}
.dropzone{

}

.dropzone .dz-title{font-weight:600;font-size:14px;color:var(--ink);}
.dropzone .dz-sub{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.preview-wrap{position:relative;border-radius:var(--radius-m);overflow:hidden;margin-bottom:14px;}

}

/* spinner */
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite;flex:none;}
.spin.dark{border:2px solid rgba(34,48,28,.18);border-top-color:var(--primary);}
@keyframes sp{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--grey-tint) 25%,#fff 37%,var(--grey-tint) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--radius-s);}

a.link{color:var(--primary-dark);font-weight:600;cursor:pointer;}

/* ============================= DESKTOP LAYOUT =============================
   Skrini pana (kompyuta): app inabadilika kutoka mpangilio wa "simu moja
   mkononi" kwenda mpangilio wa "programu ya kompyuta" - sidebar ya menyu
   upande wa kushoto, sehemu ya juu (topbar) juu ya maudhui pekee, na
   eneo la maudhui pana lenye nafasi nzuri. Hakuna fremu ya simu tena. */
@media (min-width:781px){
  body{padding:28px 20px;}
  .app-outer{align-items:flex-start;justify-content:center;}
  .app-shell{
    max-width:1180px;
    min-height:0;
    height:min(880px, calc(100vh - 56px));
    border-radius:26px;
    border:1px solid var(--card-border);
    box-shadow:var(--shadow-card), 0 40px 90px -35px rgba(34,48,28,.4);
    display:grid;
    grid-template-columns:224px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:
      "nav top"
      "nav main";
    overflow:hidden;
  }
  .app-shell:not(:has(.bottomnav)){
    grid-template-columns:1fr;
    grid-template-areas:"top" "main";
    max-width:640px;
  }
  .topbar{grid-area:top;padding:22px 34px 14px;border-bottom:1px solid var(--line);}
  .scroll{grid-area:main;padding:6px 36px 48px;max-width:660px;width:100%;margin:0 auto;overflow-x:hidden;}
  .scroll.wide{max-width:1000px;}
  /* Dashboard 2-safu (weather/stats kando) HUONEKANA tu kama kuna nafasi ya
     kutosha kando ya sidebar; vinginevyo (dirisha la kompyuta dogo/wastani,
     mfano 800-1100px) safu ya pembeni (weather) ISINGEbanwa nje ya
     mwonekano - inabaki juu ya maudhui mengine kama kwenye simu, salama
     kabisa. Hii ndiyo ilikuwa sababu "hali ya hewa ilijificha". */
  .dash-grid{display:block;}
  .dash-aside,.dash-main{display:contents;}
  .bottomnav{
    grid-area:nav;
    flex-direction:column;
    align-items:stretch;
    width:auto;height:100%;
    padding:22px 14px 20px;
    gap:2px;
    background:var(--primary-tint);
    border-top:none;
    border-right:1px solid var(--card-border);
    backdrop-filter:none;
    overflow-y:auto;
  }
  .nav-brand{display:flex;align-items:center;gap:9px;padding:6px 10px 22px;}
  .nav-brand svg{width:26px;height:26px;flex:none;}
  .nav-brand span{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);}
  .navbtn{
    flex-direction:row;justify-content:flex-start;gap:12px;

  }

  .navbtn:hover{background:rgba(255,255,255,.55);}
  .navbtn.active{background:var(--card);color:var(--primary-dark);box-shadow:var(--shadow-card);}
  .navdot{display:none !important;}
  .toast{left:50%;right:auto;bottom:28px;transform:translate(-50%,8px);max-width:420px;}
  .toast.show{transform:translate(-50%,0);}
}
/* Safu-mbili za Dashboard (maudhui + weather/stats kando) - kipimo hiki
   kinaamsha tu pale windows/skrini ni pana vya kutosha kweli (sidebar
   224px + safu-mbili za maudhui bila kubana chochote). Chini ya hapa,
   Dashboard inabaki safu-moja salama (ona kanuni ya msingi juu). */
@media (min-width:1320px){
  .dash-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start;}
  .dash-aside{display:flex;flex-direction:column;gap:16px;grid-column:2;grid-row:1;}
  .dash-main{display:flex;flex-direction:column;gap:4px;grid-column:1;grid-row:1;}
  .dash-aside .card,.dash-aside .stat-card,.dash-aside .weather-card{margin-top:0 !important;}
}
@media (max-width:780px){
  .app-outer{padding:0;}
  .app-shell{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;}
  .nav-brand{display:none;}
}

/* Kiazi Smart v2 — responsive photo frames, role workspace, accessibility */
.preview-wrap{position:relative;background:#172016;border:2px solid rgba(60,107,53,.35);border-radius:18px;padding:6px;overflow:hidden;box-shadow:0 10px 30px rgba(34,45,28,.12)}

/* Chati (Chart.js) zinazoendeshwa - zinaharibiwa na kuundwa upya kila
   render() ili zisiingiliane na canvas mpya. */
const charts = {};
function mountChart(id, config){
  const el = document.getElementById(id);
  if(!el) return;
  if(charts[id]){ try{ charts[id].destroy(); }catch(e){} }
  charts[id] = new Chart(el.getContext('2d'), config);
}

const STAGE_LABELS = {
  planted:'Imepandwa', vegetative:'Ukuaji wa Majani', tuber_initiation:'Kuanza kwa Viazi',
  bulking:'Kujaa kwa Viazi', maturation:'Kukomaa', harvested:'Imevunwa'
};
const STAGE_ORDER = ['planted','vegetative','tuber_initiation','bulking','maturation','harvested'];
const ACT_LABELS = {
  planting:'Kupanda', fertilizer_application:'Mbolea', pesticide_application:'Dawa ya Wadudu',
  irrigation:'Umwagiliaji', weeding:'Palizi', scouting:'Ukaguzi wa Shamba',
  harvesting:'Uvunaji', other:'Nyingine'
};
const ROLE_LABELS = { farmer:'Mkulima', buyer:'Mnunuzi wa Viazi', admin:'Msimamizi' };
const ROLE_PERMISSIONS = {
  farmer:['dashboard','farms','scan','market','profile'],
  buyer:['dashboard','market','profile'],
  admin:['dashboard','farms','scan','market','profile','admin']
};

/* ======================================================================
   HIFADHI YA DATA (badala ya server ya nje)
   Data zote — akaunti, mashamba, shajara, matumizi, uchunguzi — zinahifadhiwa
   kwa kudumu kwenye kifaa/akaunti yako kupitia window.storage. Endapo
   window.storage haipatikani (mfano faili limefunguliwa nje ya Claude),
   mfumo unarudi kwenye hifadhi ya muda ya kikao hiki ili programu isivunjike.
   ====================================================================== */
const LS = {
  mem: {},
  async get(key){
    try{
      if(window.storage){ const r = await window.storage.get(key, false); return r ? r.value : null; }
    }catch(e){ /* key haipo bado - hakuna tatizo */ }
    return (key in LS.mem) ? LS.mem[key] : null;
  },
  async set(key, value){
    try{ if(window.storage){ await window.storage.set(key, value, false); return; } }catch(e){}
    LS.mem[key] = value;
  },
  async del(key){
    try{ if(window.storage){ await window.storage.delete(key, false); } }catch(e){}
    delete LS.mem[key];
  }
};
const TOKENS = {}; // token (kikao) -> barua pepe, huhifadhiwa kwenye kumbukumbu ya kikao pekee

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function simpleHash(str){
  let h=0; str=String(str);
  for(let i=0;i<str.length;i++){ h=(Math.imul(31,h)+str.charCodeAt(i))|0; }
  return 'h'+(h>>>0).toString(36);
}
function currentEmail(){
  const email = state.token && TOKENS[state.token];
  if(!email) throw new Error('Muda wa kuingia umeisha. Tafadhali ingia tena.');
  return email;
}
function ownFarm(farm, email){
  if(!farm) throw new Error('Shamba halipo au limeshafutwa.');
  if(farm.owner_email!==email) throw new Error('Huna ruhusa ya kufikia shamba hili.');
  return farm;
}

async function apiRegister(p){
  const email=String(p.email||'').trim().toLowerCase();
  if(!email||!p.full_name||!p.password) throw new Error('Tafadhali jaza jina, barua pepe na nenosiri.');
  if(String(p.password).length<6) throw new Error('Nenosiri liwe na angalau herufi 6.');
  const allowedRoles=['farmer','buyer'];
  const role=allowedRoles.includes(p.role)?p.role:'farmer';
  if(await LS.get('user:'+email)) throw new Error('Barua pepe hii tayari imesajiliwa. Jaribu kuingia.');
  const user={
    id:uid('usr'),full_name:p.full_name.trim(),email,
    phone_number:p.phone_number||null,role,
    location_region:p.location_region||null,password_hash:simpleHash(p.password),
    created_at:nowISO(),permissions:ROLE_PERMISSIONS[role]
  };
  await LS.set('user:'+email,user);
  const ids=(await LS.get('users:index'))||[];
  if(!ids.includes(email)){ids.push(email);await LS.set('users:index',ids);}
  return {ok:true};
}
async function apiLogin(p){
  const email = String(p.email||'').trim().toLowerCase();
  const user = await LS.get('user:'+email);
  if(!user || user.password_hash!==simpleHash(p.password||'')) throw new Error('Barua pepe au nenosiri si sahihi.');
  const token = uid('tok');
  TOKENS[token]=email;
  const { password_hash, ...safeUser } = user;
  return { access_token: token, user: safeUser };
}
async function apiListFarms(email){
  const ids = (await LS.get('farms_by:'+email)) || [];
  const out=[];
  for(const id of ids){ const f=await LS.get('farm:'+id); if(f) out.push(f); }
  return out;
}
async function apiCreateFarm(email, p){
  if(!p.name || !p.name.trim()) throw new Error('Jina la shamba linahitajika.');
  const farm = { id: uid('farm'), owner_email: email, name: p.name.trim(),
    region: p.region||null, size_acres: (p.size_acres!==undefined && p.size_acres!=='') ? Number(p.size_acres) : null,
    soil_type:p.soil_type||null, latitude:(p.latitude!==undefined&&p.latitude!=='')?Number(p.latitude):null, longitude:(p.longitude!==undefined&&p.longitude!=='')?Number(p.longitude):null,
    created_at: nowISO() };
  await LS.set('farm:'+farm.id, farm);
  const ids = (await LS.get('farms_by:'+email)) || [];
  ids.unshift(farm.id);
  await LS.set('farms_by:'+email, ids);
  return farm;
}
async function apiDeleteFarm(email, farmId){
  ownFarm(await LS.get('farm:'+farmId), email);
  await LS.del('farm:'+farmId);
  await LS.del('cycles:'+farmId); await LS.del('activities:'+farmId);
  await LS.del('expenses:'+farmId); await LS.del('scans:'+farmId);
  const ids = ((await LS.get('farms_by:'+email))||[]).filter(id=>id!==farmId);
  await LS.set('farms_by:'+email, ids);
  return { ok:true };
}

async function apiDeleteSub(kind, email, farmId, itemId){

function mkCycle(p){

  return { id: uid('cyc'), variety: p.variety||null, planting_date: p.planting_date||null,
    expected_harvest_date: p.expected_harvest_date||null, stage, is_active: stage!=='harvested', created_at: nowISO() };
}
function mkActivity(p){
  return { id: uid('act'), crop_cycle_id: p.crop_cycle_id||null, activity_type: p.activity_type||'other',

function mkExpense(p){
  if(!p.category || !(Number(p.amount)>=0)) throw new Error('Jaza aina na kiasi cha gharama kwa usahihi.');
  return { id: uid('exp'), category: p.category, amount: Number(p.amount)||0, currency: p.currency||'TZS',
    expense_date: p.expense_date||nowISO().slice(0,10), notes: p.notes||null, created_at: nowISO() };
}
async function apiExpenseSummary(email, farmId){
  const list = await apiListSub('expenses', email, farmId);
  let total=0; const by_category={};
  list.forEach(e=>{ total+=Number(e.amount)||0; by_category[e.category]=(by_category[e.category]||0)+(Number(e.amount)||0); });
  return { total_expenses: total, by_category };
}

   anategemea kutumia na mauzo/faida anayotarajia, akilinganisha na
   gharama halisi alizokwisha kuandika kwenye "Matumizi". Data zote
   zinahifadhiwa moja kwa moja kwenye akaunti yake (window.storage).
   ====================================================================== */
async function loadBudget(farmId){
  let b = null;
  try{ b = await LS.get('budget:'+farmId); }catch(e){}
  state.budgets[farmId] = b || { planned_harvest_kg:null, planned_price_per_kg:null, planned_costs:[] };
  render();
}
async function saveBudgetPlan(farmId, hargv, pricev, btn){
  const b = state.budgets[farmId] || { planned_costs:[] };
  b.planned_harvest_kg = (hargv!==undefined && hargv!=='') ? Number(hargv) : null;
  b.planned_price_per_kg = (pricev!==undefined && pricev!=='') ? Number(pricev) : null;
  setBusy(btn, true);
  try{
    await LS.set('budget:'+farmId, b);
    state.budgets[farmId] = b;
    showToast('Mpango wa mauzo umehifadhiwa.');
  }catch(e){ showToast(e.message||'Imeshindwa kuhifadhi.', true); }
  setBusy(btn, false);
}
async function addPlannedCost(farmId, payload, btn){
  state.formErr='';
  if(!payload.category || !(Number(payload.amount)>0)){ state.formErr='Jaza aina na kiasi cha gharama kwa usahihi.'; render(); return; }
  const b = state.budgets[farmId] || { planned_costs:[] };
  b.planned_costs = b.planned_costs || [];
  b.planned_costs.unshift({ id: uid('pc'), category: payload.category, amount: Number(payload.amount) });
  setBusy(btn, true);
  try{
    await LS.set('budget:'+farmId, b);
    state.budgets[farmId] = b;
    state.sheet = null;
    showToast('Gharama ya mpango imeongezwa.');
  }catch(e){ state.formErr = e.message; }
  setBusy(btn, false);
}

/* ======================================================================
   HALI YA HEWA (Weather Intelligence) — Open-Meteo (data halisi, bila
   funguo/API key, bure kutumika moja kwa moja kutoka kwenye kivinjari).
   Tunahesabu pia "hatari ya ugonjwa" (disease risk) kwa mtindo rahisi:
   Late Blight hupendelea unyevu mkubwa + joto la wastani + mvua;
   Early Blight hupendelea joto zaidi na unyevu wa chini kiasi.
   ====================================================================== */
async function fetchWeather(regionKey){
  const r = regionByKey(regionKey);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${r.lat}&longitude=${r.lng}` +
    `&current=temperature_2m,relative_humidity_2m,precipitation,weather_code` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,relative_humidity_2m_max,weather_code,wind_speed_10m_max` +
    `&timezone=Africa%2FNairobi&forecast_days=7`;
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(url, {signal: ctrl.signal});
    if(!res.ok) throw new Error('Seva ya hali ya hewa haikujibu (status '+res.status+').');
    return await res.json();
  } finally { clearTimeout(t); }
}
function weatherCodeInfo(code){
  // Ramani fupi ya WMO weather codes -> emoji + maelezo mafupi ya Kiswahili
  if(code===0) return {icon:'☀️', label:'Jua kali'};
  if([1,2].includes(code)) return {icon:'🌤️', label:'Jua na mawingu kidogo'};
  if(code===3) return {icon:'☁️', label:'Mawingu mengi'};
  if([45,48].includes(code)) return {icon:'🌫️', label:'Ukungu'};
  if([51,53,55,56,57].includes(code)) return {icon:'🌦️', label:'Manyunyu'};
  if([61,63,65,66,67,80,81,82].includes(code)) return {icon:'🌧️', label:'Mvua'};
  if([95,96,99].includes(code)) return {icon:'⛈️', label:'Radi na mvua'};
  return {icon:'🌡️', label:'Hali ya hewa'};
}
function computeDiseaseRisk(current, dailyMaxHumidity, dailyRain){
  // Alama rahisi ya hatari (0-100) - kwa madhumuni ya elimu/onyo la awali TU,
  // si mbadala wa ushauri wa kitaalamu (angalia Section 13 ya proposal).
  const hum = current.relative_humidity_2m ?? 60;
  const temp = current.temperature_2m ?? 22;
  const rainSoon = (dailyRain||[]).slice(0,3).reduce((a,b)=>a+(b||0),0);
  let lateBlightRisk = 0;
  if(hum>75 && temp>=10 && temp<=25) lateBlightRisk += 45;
  if(rainSoon>5) lateBlightRisk += 35;
  if(hum>85) lateBlightRisk += 20;
  lateBlightRisk = Math.min(100, lateBlightRisk);
  let level, tone, advice;
  if(lateBlightRisk>=60){
    level='Juu'; tone='danger';
    advice='Hali ya hewa (unyevu mkubwa + mvua) inafaa kwa kusambaa kwa Late Blight. Kagua mashamba mara kwa mara na fikiria dawa ya kinga ya fangasi.';
  } else if(lateBlightRisk>=30){
    level='Wastani'; tone='warn';
    advice='Kuna uwezekano wa wastani wa magonjwa ya fangasi. Endelea kukagua majani mara kwa mara.';
  } else {
    level='Chini'; tone='healthy';
    advice='Hali ya hewa kwa sasa haifai sana kusambaza magonjwa ya fangasi kwa haraka.';
  }
  return { score:lateBlightRisk, level, tone, advice };
}
async function fetchWeatherByCoords(lat,lng,name){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
    `&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,relative_humidity_2m_max,wind_speed_10m_max` +
    `&timezone=Africa%2FNairobi&forecast_days=7`;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),8000);
  try{ const res=await fetch(url,{signal:ctrl.signal}); if(!res.ok) throw new Error('Weather server error '+res.status); return await res.json(); }
  finally{ clearTimeout(timer); }
}

function marketAvgPriceByRegion(listings){
  const byRegion = {};
  listings.forEach(l=>{
    if(!byRegion[l.region]) byRegion[l.region] = {sum:0, n:0};
    byRegion[l.region].sum += l.price_per_kg; byRegion[l.region].n++;
  });
  return Object.keys(byRegion).map(region=>({region, avg: Math.round(byRegion[region].sum/byRegion[region].n)}))
    .sort((a,b)=>b.avg-a.avg);
}

/* ---------- Uchunguzi wa jani (uchambuzi wa rangi ya picha - onyesho la awali) ---------- */
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('Imeshindwa kusoma picha. Jaribu picha nyingine.'));
    img.src = URL.createObjectURL(file);
  });
}
async function analyzeLeafImage(file){
  const img = await loadImageFromFile(file);
  const size=110;
  const canvas=document.createElement('canvas');
  canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,size,size);
  let data;
  try{ data=ctx.getImageData(0,0,size,size).data; }catch(e){ throw new Error('Imeshindwa kuchambua picha hii.'); }
  let green=0, dark=0, yellow=0, total=0;
  for(let i=0;i<data.length;i+=4){
    const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
    if(a<10) continue;
    total++;
    const maxc=Math.max(r,g,b), minc=Math.min(r,g,b), bri=(r+g+b)/3;
    if(g>r*1.05 && g>b*1.1 && bri>60) green++;
    else if(bri<95 && (maxc-minc)<55) dark++;
    else if(r>150 && g>120 && b<130 && r>=g && g>=b) yellow++;
  }
  if(total===0) throw new Error('Picha haikusomeka vizuri.');
  const greenR=green/total, darkR=dark/total, yellowR=yellow/total;
  const leafSignal = greenR + yellowR*0.6 + darkR*0.5;
  let s;
  if(leafSignal<0.22){
    s = { Not_Potato_Leaf:3.0, Potato___healthy:-1, Potato___Early_blight:-1, Potato___Late_blight:-1.4 };
  } else {
    const lesion = darkR*2.1 + yellowR*0.9;
    s = {
      Potato___healthy: (greenR*3)-(lesion*2.6),
      Potato___Early_blight: (yellowR*2.4+darkR*1.3)-Math.abs(lesion-0.9),
      Potato___Late_blight: (darkR*3.0)-(yellowR*0.6),
      Not_Potato_Leaf: (leafSignal<0.32? 0.5:-2.2)
    };
  }
  const keys=Object.keys(s);
  const ex=keys.map(k=>Math.exp(s[k]));
  const sum=ex.reduce((a,b)=>a+b,0);
  const all_probabilities={};
  keys.forEach((k,i)=> all_probabilities[k]=ex[i]/sum);
  const predicted_class = keys.reduce((b,k)=> all_probabilities[k]>all_probabilities[b]?k:b, keys[0]);
  return { predicted_class, confidence: all_probabilities[predicted_class], all_probabilities };
}
/* Jaribu kupata utambuzi HALISI kutoka kwa backend (potato_backend, model
   ya MobileNetV2 iliyofunzwa) kupitia POST /api/predict. Ikishindwa (mfano
   seva haijawashwa, hakuna mtandao), tunarudi kwenye uchambuzi wa ndani
   (heuristic) kama nakala rudufu (fallback) ili programu isivunjike. */
async function tryRealModelPredict(file){
  const ctrl = new AbortController();
  const detecting = state.backendMode !== 'real';
  const t = setTimeout(()=>ctrl.abort(), detecting ? 3500 : 12000);
  try{
    const fd = new FormData();
    fd.append('file', file, file.name || 'leaf.jpg');
    const res = await fetch(state.aiBackendUrl.replace(/\/+$/,'') + '/api/predict', {
      method:'POST', body: fd, signal: ctrl.signal,
    });
    if(!res.ok){
      let msg = 'Server error '+res.status;
      try{ const j = await res.json(); if(j.detail) msg = j.detail; }catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    return { predicted_class:data.predicted_class, confidence:data.confidence, all_probabilities:data.all_probabilities };
  } finally { clearTimeout(t); }
}
async function apiCreateScan(email, farmId, formData, cropCycleId){
  ownFarm(await LS.get('farm:'+farmId), email);
  const file = formData.get('file');
  if(!file) throw new Error('Chagua picha ya jani kwanza.');

  let r, source, modelNote;
  try{
    r = await tryRealModelPredict(file);
    source = 'ai_model';
    modelNote = null;
  }catch(e){
    r = await analyzeLeafImage(file);
    source = 'demo_heuristic';
    modelNote = e && e.name==='AbortError'
      ? 'Muunganiko na seva ya AI umechelewa - tumetumia modi ya onyesho.'
      : 'Seva ya AI (backend) haipatikani kwa sasa - tumetumia modi ya onyesho. Angalia "Mipangilio > Anwani ya Seva ya AI".';
  }

  const record = { id: uid('scan'), crop_cycle_id: cropCycleId?decodeURIComponent(cropCycleId):null,
    predicted_class:r.predicted_class, confidence:r.confidence, all_probabilities:r.all_probabilities,
    source, model_note: modelNote, created_at: nowISO() };
  const list = (await LS.get('scans:'+farmId)) || [];
  list.unshift(record);
  await LS.set('scans:'+farmId, list);
  return record;
}

/* ======================================================================
   USHIRIKIANO NA BACKEND HALISI (potato_backend / FastAPI)
   ------------------------------------------------------------------
   Mkakati: jaribu kufikia seva HALISI kwanza. Ikifanikiwa mara moja
   kwenye kikao hiki (session), tunabaki "real" mode kwa kikao chote ili
   kuepuka kuchanganya akaunti za real-backend na za local-demo. Ikiwa
   seva haipatikani KABISA tangu mwanzo (mfano: hujaanzisha uvicorn),
   tunatumia "local" mode (uigaji wa ndani ya kivinjari) ili programu
   iendelee kufanya kazi bila mtandao — muhimu kwa maonyesho/mafunzo na
   maeneo yenye mtandao hafifu.
   ====================================================================== */
async function apiFetchReal(path, method, body, isForm, needsAuth){
  const headers = {};
  if(!isForm) headers['Content-Type'] = 'application/json';
  if(needsAuth!==false && state.token) headers['Authorization'] = 'Bearer '+state.token;
  const ctrl = new AbortController();
  // Kama bado hatujathibitisha seva halisi ipo (backendMode!=='real'), hii ni
  // "ugunduzi" (detection) tu - usisubiri sekunde 15 bure kabla ya kurudi
  // kwenye modi ya ndani. Seva halisi ikishathibitika, tunarudisha muda
  // mrefu zaidi kwa maombi halisi (yanaweza kuchukua muda kwenye mtandao
  // dhaifu, hasa kupakia picha kwenye /api/predict).
  const detecting = state.backendMode !== 'real';
  const timeoutMs = detecting ? 2500 : 15000;
  const t = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(state.aiBackendUrl.replace(/\/+$/,'') + path, {
      method, headers,
      body: isForm ? body : (body!==undefined ? JSON.stringify(body) : undefined),
      signal: ctrl.signal
    });
    if(!res.ok){
      let msg = 'Server error '+res.status;
      try{ const j = await res.json(); if(j.detail) msg = j.detail; }catch(e){}
      const err = new Error(msg); err.httpStatus = res.status; throw err;
    }
    return await res.json();
  } finally { clearTimeout(t); }
}
async function api(path, opts={}){
  const { method='GET', body, isForm=false, auth } = opts;

  if(state.backendMode==='local'){
    await new Promise(r=>setTimeout(r, 160+Math.random()*160));
    return await routeApi(method, path, body);
  }

  try{
    const data = await apiFetchReal(path, method, body, isForm, auth);
    state.backendMode = 'real';
    return data;
  }catch(e){
    if(e.httpStatus){
      // Seva HALISI ilifikiwa na ikakataa ombi (nenosiri sahihi n.k) -
      // huu ni ujumbe halisi wa kosa, hatutaki kuuficha kwa demo fallback.
      state.backendMode = 'real';
      throw e;
    }
    if(state.backendMode==='real'){
      // Tulikuwa tumeshaunganishwa na seva halisi lakini sasa mtandao
      // umekatika kwa muda - usibadilishe kimya kimya kwenda local (hiyo
      // ingeweza kuchanganya akaunti), toa ujumbe wazi badala yake.
      throw new Error('Imeshindwa kuunganisha na seva ya Kiazi Smart. Angalia mtandao wako kisha jaribu tena.');
    }
    // Seva haijafikiwa kabisa tangu mwanzo wa kikao - tumia modi ya ndani.
    state.backendMode = 'local';
    await new Promise(r=>setTimeout(r, 160+Math.random()*160));
    return await routeApi(method, path, body);
  }
}

async function routeApi(method, path, body){
  let m;
  if(method==='POST' && path==='/api/auth/register') return apiRegister(body);
  if(method==='POST' && path==='/api/auth/login') return apiLogin(body);
  if(method==='GET' && path==='/api/admin/users') return apiAdminListUsers();
  if(method==='POST' && path==='/api/admin/reset-password') return apiAdminResetPassword(body.email,body.new_password);
  if(method==='GET' && path==='/api/farms') return apiListFarms(currentEmail());
  if(method==='POST' && path==='/api/farms') return apiCreateFarm(currentEmail(), body);
  if(method==='DELETE' && (m=path.match(/^\/api\/farms\/([^\/]+)$/))) return apiDeleteFarm(currentEmail(), m[1]);
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/crop-cycles$/))){
    return method==='GET' ? apiListSub('cycles',currentEmail(),m[1]) : apiCreateSub('cycles',currentEmail(),m[1],mkCycle(body));
  }
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/activities$/))){
    return method==='GET' ? apiListSub('activities',currentEmail(),m[1]) : apiCreateSub('activities',currentEmail(),m[1],mkActivity(body));
  }
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/activities\/([^\/]+)$/)) && method==='DELETE'){
    return apiDeleteSub('activities', currentEmail(), m[1], m[2]);
  }
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/expenses\/summary$/)) && method==='GET') return apiExpenseSummary(currentEmail(), m[1]);
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/expenses$/))){
    return method==='GET' ? apiListSub('expenses',currentEmail(),m[1]) : apiCreateSub('expenses',currentEmail(),m[1],mkExpense(body));
  }
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/expenses\/([^\/]+)$/)) && method==='DELETE'){
    return apiDeleteSub('expenses', currentEmail(), m[1], m[2]);
  }
  if((m=path.match(/^\/api\/farms\/([^\/]+)\/disease-scans(?:\?crop_cycle_id=(.*))?$/))){
    return method==='GET' ? apiListSub('scans',currentEmail(),m[1]) : apiCreateScan(currentEmail(),m[1],body,m[2]);
  }
  if((m=path.match(/^\/api\/market(?:\?region=(.*))?$/)) && method==='GET'){
    return apiListMarketLocal(m[1]?decodeURIComponent(m[1]):null);
  }
  if(method==='POST' && path==='/api/market') return apiCreateListingLocal(body);
  if((m=path.match(/^\/api\/market\/([^\/]+)$/)) && method==='DELETE') return apiDeleteListingLocal(m[1]);
  throw new Error('Njia haijulikani ndani ya programu.');
}

/* ---------- Mawasiliano/Kushiriki (social) ----------
   Msaidizi mmoja wa kushiriki maandishi/matokeo kupitia WhatsApp au
   sanduku la "share" la kifaa (Web Share API), ili mkulima aweze kutuma
   matokeo ya uchunguzi, matangazo ya soko, au app yenyewe kwa urahisi
   kwa mtaalamu wa kilimo, familia au vikundi vya WhatsApp. */
function shareText(text, title){
  if(navigator.share){
    navigator.share({title: title||'Kiazi Smart', text}).catch(()=>{});
  } else {
    window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank', 'noopener');
  }
}
function shareButton(text, label){
  const payload = JSON.stringify(text).replace(/'/g,"\\u0027");
  return `<button class="btn btn-ghost btn-sm" onclick='shareText(${payload})'>${ic.share} ${label||'Shiriki'}</button>`;
}

async function loadFarmBundle(farmId){

      api(`/api/farms/${farmId}/crop-cycles`),

      api(`/api/farms/${farmId}/expenses/summary`),
      api(`/api/farms/${farmId}/disease-scans`),
    ]);
    state.cropCycles[farmId]=cycles; state.activities[farmId]=acts;
    state.expenses[farmId]=exps; state.expensesSummary[farmId]=summary; state.scans[farmId]=scans;
  }catch(e){ showToast(e.message, true); }
  state.loading['bundle_'+farmId]=false; render();
}

async function loadDashboard(){
  state.dashboard.loading = true; render();
  try{
    if(!state.farmsLoaded){ state.farms = await api('/api/farms'); state.farmsLoaded = true; }
    let totalExpense = 0, activeCycles = 0; const recentScans = [];
    const sample = state.farms.slice(0,5);
    await Promise.all(sample.map(async f=>{
      try{
        const [summary, cycles, scans] = await Promise.all([
          api(`/api/farms/${f.id}/expenses/summary`),
          api(`/api/farms/${f.id}/crop-cycles`),
          api(`/api/farms/${f.id}/disease-scans`),
        ]);
        totalExpense += summary.total_expenses || 0;
        activeCycles += cycles.filter(c=>c.is_active).length;
        scans.slice(0,2).forEach(s=> recentScans.push({...s, farmName:f.name}));
        state.expensesSummary[f.id] = summary;
        if(!state.budgets[f.id]){
          try{ state.budgets[f.id] = (await LS.get('budget:'+f.id)) || { planned_harvest_kg:null, planned_price_per_kg:null, planned_costs:[] }; }catch(e){}
        }
      }catch(e){ /* skip a broken farm silently on dashboard */ }
    }));
    recentScans.sort((a,b)=> new Date(b.created_at)-new Date(a.created_at));
    state.dashboard.totalExpense = totalExpense;
    state.dashboard.activeCycles = activeCycles;
    state.dashboard.recentScans = recentScans.slice(0,3);
  }catch(e){ showToast(e.message, true); }
  state.dashboard.loading = false; render();
}
/* Historia - inakusanya shughuli za shamba (shajara) na uchunguzi wa AI
   kutoka mashamba YOTE ya mkulima, kisha kuvipanga kwa tarehe (mpya
   kwanza) katika orodha moja rahisi kufuatilia. */
async function loadHistory(){
  if(!hasPermission('farms')){ state.history.loaded = true; render(); return; }
  state.history.loading = true; render();
  try{
    if(!state.farmsLoaded){ state.farms = await api('/api/farms'); state.farmsLoaded = true; }
    const items = [];
    await Promise.all(state.farms.map(async f=>{
      try{
        const [acts, scans] = await Promise.all([
          api(`/api/farms/${f.id}/activities`),
          api(`/api/farms/${f.id}/disease-scans`),
        ]);
        (acts||[]).forEach(a=> items.push({
          kind:'activity', date:a.activity_date||a.created_at, farmName:f.name,
          title: ACT_LABELS[a.activity_type]||a.activity_type||'Shughuli',
          sub: a.description||'', icon: ic.book,
        }));
        (scans||[]).forEach(s=> items.push({
          kind:'scan', date:s.created_at, farmName:f.name,
          title: (DISEASE_LABELS[s.predicted_class]||{}).label || s.predicted_class,
          sub: `Uhakika: ${Math.round((s.confidence||0)*100)}%`,
          icon: diseaseIcon((DISEASE_LABELS[s.predicted_class]||{}).tone),
          tone: (DISEASE_LABELS[s.predicted_class]||{}).tone,
        }));
      }catch(e){ /* ruka shamba lenye tatizo, endelea na mengine */ }
    }));
    items.sort((a,b)=> new Date(b.date)-new Date(a.date));
    state.history.items = items;
  }catch(e){ showToast(e.message, true); }
  state.history.loading = false; state.history.loaded = true; render();
}
function historySheet(){
  const open = state.sheet==='history';

    body = `<div style="text-align:center;padding:26px 10px;"><p class="muted" style="margin:0;">Historia ya shughuli inapatikana kwa akaunti za mkulima kwa sasa. Kama ${ROLE_LABELS[state.user&&state.user.role]||'mnunuzi'}, unaweza kuona matangazo yako ya soko kwenye tab ya Soko.</p></div>`;

/* Muhtasari wa fedha wa mashamba YOTE - kinachomsaidia mkulima kuona kwa
   pamoja: mauzo anayopanga kupata, gharama alizopanga kutumia, gharama
   halisi alizokwisha tumia, na faida anayotarajia - bila kuingia shamba
   moja moja. */
function financeOverview(){
  let plannedRevenue=0, plannedCost=0, actualCost=0, farmsWithPlan=0;
  state.farms.forEach(f=>{
    const b = state.budgets[f.id];
    if(b && (b.planned_harvest_kg || (b.planned_costs&&b.planned_costs.length))){
      plannedRevenue += Number(b.planned_harvest_kg||0)*Number(b.planned_price_per_kg||0);
      plannedCost += (b.planned_costs||[]).reduce((s,c)=>s+Number(c.amount||0),0);
      farmsWithPlan++;
    }
    const s = state.expensesSummary[f.id];
    if(s) actualCost += s.total_expenses||0;
  });
  return { plannedRevenue, plannedCost, actualCost, projectedProfit: plannedRevenue-plannedCost, farmsWithPlan };
}

function pickFile(inputEl){
  const f=inputEl.files&&inputEl.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){showToast('Chagua picha ya jani.',true);return;}
  if(f.size>8*1024*1024){showToast('Picha ni kubwa mno. Tumia picha hadi 8MB.',true);return;}
  if(state.scanForm.previewUrl){try{URL.revokeObjectURL(state.scanForm.previewUrl)}catch(e){}}
  state.scanForm.file=f;
  state.scanForm.previewUrl=URL.createObjectURL(f);
  state.scanForm.result=null;state.scanForm.err=null;state.scanForm.analyzing=true;state.scanForm.autoStarted=true;
  render();
  setTimeout(autoAnalyzeScan,40);
}
async function autoAnalyzeScan(){
  const sf=state.scanForm;
  if(!sf.file||!sf.analyzing)return;
  try{
    let r,source='ai_model',modelNote=null;
    if(state.backendMode==='local'){
      r=await analyzeLeafImage(sf.file);
      source='demo_heuristic';
      modelNote='AI server haipatikani kwenye kikao hiki; tathmini ya haraka ya ndani imeonyeshwa.';
    }else{
      try{r=await tryRealModelPredict(sf.file);state.backendMode='real';}
      catch(e){
        r=await analyzeLeafImage(sf.file);source='demo_heuristic';
        modelNote=e&&e.name==='AbortError'?'AI server imechelewa; tathmini ya haraka imeonyeshwa.':'AI server haipatikani; tathmini ya haraka imeonyeshwa. Unganisha backend kwa model iliyofunzwa.';
        if(state.backendMode!=='real')state.backendMode='local';
      }
    }
    sf.result={...r,source,model_note:modelNote,created_at:nowISO(),id:uid('scan_preview')};
    sf.err=null;
  }catch(e){sf.err=e.message||'Imeshindwa kuchambua picha.';}
  sf.analyzing=false;render();
}

async function submitScan(btn){

  try{

  setBusy(btn,false);

function weatherCard(){
  const w = state.weather;
  const regionOptions = [`<option value="GPS" ${w.region==='GPS'?'selected':''}>📍 GPS yangu</option>`, ...TZ_REGIONS.map(r=>`<option value="${r.key}" ${r.key===w.region?'selected':''}>${r.key}${r.potatoZone?' 🥔':''}</option>`)].join('');
  const farmOptions = state.farms.filter(f=>f.latitude&&f.longitude).slice(0,6).map(f=>`<button class="btn btn-ghost btn-sm" onclick="loadWeatherCoords(${f.latitude},${f.longitude},'${esc(f.name).replace(/'/g,"\\'")}')">🌱 ${esc(f.name)}</button>`).join('');
  const selector = `<select class="weather-select" onchange="this.value==='GPS'?useMyLocationWeather():loadWeather(this.value)">${regionOptions}</select>`;
  if(w.loading){ return `<div class="weather-card">${Skel(120)}</div>`; }
  if(w.error){ return `<div class="weather-card"><div class="weather-top"><div class="h2" style="margin:0;">${t('weather')}</div>${selector}</div><p class="muted" style="margin:10px 0 0;font-size:12.5px;">${esc(w.error)}</p><button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="loadWeather(state.weather.region==='GPS'?'Mbeya':state.weather.region)">Jaribu tena</button></div>`; }
  if(!w.data) return `<div class="weather-card">${Skel(120)}</div>`;
  const cur=w.data.raw.current, daily=w.data.raw.daily, info=weatherCodeInfo(cur.weather_code), risk=w.data.risk;
  const days=['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];
  const months=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ago','Sep','Okt','Nov','Des'];
  const todayFull = (()=>{ const now=new Date(); return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`; })();
  const range = w.range || 'day';
  const totalDays = daily.time.length;
  const visibleCount = range==='week' ? Math.min(7, totalDays) : Math.min(4, totalDays);
  const selIdx = Math.min(w.selectedIndex||0, visibleCount-1);
  const dayLabel=(i)=>{ const dt=new Date(daily.time[i]+'T00:00:00'); return i===0?'Leo':SHORT_DAYS_SW[dt.getDay()]; };
  const dateLabel=(i)=>{ const dt=new Date(daily.time[i]+'T00:00:00'); return `${dt.getDate()} ${months[dt.getMonth()]}`; };
  const forecast=daily.time.slice(0, visibleCount).map((d,i)=>{
    const sel = i===selIdx ? ' selected' : '';
    return `<div class="forecast-day${sel}" onclick="state.weather.selectedIndex=${i};render()"><div class="fd-name">${dayLabel(i)}</div><div class="tiny" style="color:var(--ink-faint);margin-top:1px;">${dateLabel(i)}</div><div class="fd-icon">${weatherCodeInfo(daily.weather_code?.[i]??cur.weather_code).icon}</div><div class="fd-temp">${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°</div><div class="tiny">${Math.round(daily.precipitation_sum[i]||0)}mm</div></div>`;
  }).join('');
  const dateOptions = daily.time.slice(0, visibleCount).map((d,i)=>`<option value="${i}" ${i===selIdx?'selected':''}>${dayLabel(i)}, ${dateLabel(i)}</option>`).join('');
  const dateSelect = `<select class="weather-select" onchange="state.weather.selectedIndex=Number(this.value);render()">${dateOptions}</select>`;
  const name=w.data.locationName||w.region;
  const rangeToggle=`<div class="seg" style="width:auto;">
    <button class="${range==='day'?'active':''}" onclick="state.weather.range='day';state.weather.selectedIndex=0;render()">Siku chache</button>
    <button class="${range==='week'?'active':''}" onclick="state.weather.range='week';render()">Wiki nzima</button>
  </div>`;
  const advice = farmAdviceForDay(selIdx, daily);
  const adviceBox = `<div class="farm-advice-box"><div class="fa-title">🌾 Ushauri wa shambani — ${dayLabel(selIdx)}, ${dateLabel(selIdx)}</div><div class="tiny" style="line-height:1.55;color:var(--ink);">${esc(advice)}</div></div>`;
  return `<div class="weather-card"><div class="weather-top"><div class="h2" style="margin:0;">${t('weather')}</div>${selector}</div><div class="tiny" style="margin-top:5px;">📍 ${esc(name)} · 🗓️ ${todayFull}</div><div class="row" style="align-items:flex-end;gap:14px;margin-top:6px;"><div class="weather-temp">${Math.round(cur.temperature_2m)}°C</div><div style="padding-bottom:4px;"><div style="font-size:13px;font-weight:600;">${info.icon} ${info.label}</div><div class="tiny">Unyevu: ${Math.round(cur.relative_humidity_2m)}% · Mvua: ${Number(cur.precipitation||0).toFixed(1)}mm · Upepo: ${Math.round(cur.wind_speed_10m||0)} km/h</div></div></div><div class="risk-pill ${risk.tone}">${ic.alert} Hatari ya Late Blight: ${risk.level} (${risk.score}%)</div><p class="tiny" style="margin:8px 0 0;line-height:1.5;">${esc(risk.advice)}</p>${farmOptions?`<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:9px;"><span class="tiny" style="width:100%;">Hali ya hewa ya mashamba yenye GPS:</span>${farmOptions}</div>`:''}<div class="row between" style="margin-top:12px;align-items:center;flex-wrap:wrap;gap:8px;"><div class="tiny" style="font-weight:600;">Utabiri: ${range==='week'?'Siku 7 zijazo':'Siku 4 zijazo'}</div>${rangeToggle}</div><div class="field" style="margin-top:10px;margin-bottom:0;"><label>Chagua tarehe ya kuangalia</label>${dateSelect}</div><div class="forecast-row" style="margin-top:10px;">${forecast}</div>${adviceBox}<div class="chart-wrap"><canvas id="chart-weather-forecast"></canvas></div><p class="tiny" style="margin-top:6px;color:var(--ink-faint);">Chanzo: Open-Meteo · Alama ya hatari ni makadirio ya awali tu, si mbadala wa ushauri wa kitaalamu.</p></div>`;
}
/* Ushauri wa kilimo unaotokana na hali ya hewa ya siku husika — huchambua
   mvua, unyevu, upepo na joto la siku iliyochaguliwa na kutoa vidokezo
   vifupi vya nini mkulima anaweza kufanya shambani kwake siku hiyo. */
function farmAdviceForDay(idx, daily){
  const rain = Number(daily.precipitation_sum?.[idx] || 0);
  const tmax = daily.temperature_2m_max?.[idx];
  const tmin = daily.temperature_2m_min?.[idx];
  const humidity = daily.relative_humidity_2m_max?.[idx];
  const wind = Number(daily.wind_speed_10m_max?.[idx] || 0);
  const tips = [];
  if(rain >= 10){
    tips.push('Mvua kubwa inatarajiwa — epuka kunyunyizia dawa (itaoshwa na mvua), na hakikisha mifereji ya maji shambani inapitisha vizuri kuepusha maji kutuama kwenye mizizi.');
  } else if(rain >= 3){
    tips.push('Kutakuwa na manyunyu ya wastani — siku nzuri ya kupanda miche au kuweka mbolea kwani udongo utakuwa na unyevu wa kutosha.');
  } else {
    tips.push('Hakuna mvua ya kutosha siku hii — ni siku nzuri ya kunyunyizia dawa asubuhi au jioni, na kumwagilia kama udongo umekauka.');
  }
  if(humidity!=null && humidity >= 80){
    tips.push('Unyevu mkubwa hewani unaongeza hatari ya magonjwa ya fangasi (mfano Late Blight) — kagua majani mara kwa mara na fikiria dawa ya kinga.');
  }
  if(wind >= 25){
    tips.push('Upepo mkali unatarajiwa — usinyunyizie dawa (itapeperushwa), na imarisha miche michanga isivunjike.');
  }
  if(tmax!=null && tmax >= 30){
    tips.push('Joto kali litakuwepo mchana — mwagilia mapema asubuhi au jioni kuepuka upotevu wa maji kwa mvuke.');
  } else if(tmin!=null && tmin <= 12){
    tips.push('Baridi kali itakuwepo usiku — ukuaji wa mimea unaweza kupungua kasi; panga shughuli nyingine za shambani kwa siku hii.');
  }
  return tips.slice(0,3).join(' ');
}
/* Inaunganisha tokeo la uchunguzi wa jani (model) na hali ya hewa ya sasa
   ili kumpa mkulima onyo moja lililokamilika, badala ya taarifa mbili
   tofauti zisizohusiana. Inaonekana tu pale zote mbili zinapatikana. */
function weatherRiskFollowup(predictedClass){
  const w = state.weather;
  if(!w.data || !w.data.risk) return '';
  const risk = w.data.risk;
  const isBlight = predictedClass==='Potato___Late_blight' || predictedClass==='Potato___Early_blight';
  if(!isBlight || risk.score < 30) return '';
  const urgent = predictedClass==='Potato___Late_blight' && risk.score>=60;
  return `
  <div class="note-box" style="margin-top:12px;border-color:${urgent?'var(--danger)':'var(--accent)'};">
    ${ic.alert}
    <div>
      <b>${urgent?'Onyo la Haraka':'Kumbuka'}:</b>
      Jani hili linaonyesha dalili za ugonjwa, na hali ya hewa ya ${esc(w.region)} kwa sasa ina hatari ya "${esc(risk.level)}" ya kusambaza magonjwa ya fangasi
      (unyevu/mvua). Hii inaongeza uwezekano wa ugonjwa kuenea haraka kwenye mimea mingine ya shamba lako — chukua hatua zilizopendekezwa hapo juu bila kuchelewa.
    </div>
  </div>`;
}

function loginForm(){
  return `
    <form onsubmit="event.preventDefault(); doLogin(this.email.value, this.password.value, this.querySelector('button[type=submit]'));">
      <div class="field"><label>Barua pepe</label><input class="input" id="login_email" name="email" type="email" placeholder="wewe@mfano.co.tz" required></div>
      <div class="field"><label>Nenosiri</label><input class="input" id="login_password" name="password" type="password" placeholder="••••••••" required></div>
      ${state.formErr ? `<div class="err-text">${esc(state.formErr)}</div>` : ''}
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:6px;" ${state.busy?'disabled':''}>
        ${state.busy?'<span class="spin"></span>':''} Ingia
      </button>
    </form>
    <div class="note-box" style="margin-top:14px;"><div><b>Akaunti za majaribio</b><div class="tiny" style="margin-top:5px;">Bonyeza akaunti kujaza login moja kwa moja.</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:9px;">${[['Admin','admin@kiazi.tz','Admin123!'],['Mkulima','farmer@kiazi.tz','Farmer123!'],['Mnunuzi wa Viazi','buyer@kiazi.tz','Buyer123!']].map(([n,e,p])=>`<button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('login_email').value='${e}';document.getElementById('login_password').value='${p}'">${n}</button>`).join('')}</div></div></div>
    <p class="tiny" style="text-align:center;margin-top:16px;">Huna akaunti? <a class="link" onclick="state.authTab='register';render()">Jisajili sasa</a></p>
  `;
}
function registerForm(){
  return `
    <form onsubmit="event.preventDefault();
      const f=this;
      doRegister({
        full_name:f.full_name.value, email:f.email.value, phone_number:f.phone_number.value||null,
        password:f.password.value, role:f.role.value, location_region:f.location_region.value||null
      }, f.querySelector('button[type=submit]'));">
      <div class="field"><label>Jina kamili</label><input class="input" name="full_name" placeholder="Mfano: Amina Juma" required></div>
      <div class="field"><label>Barua pepe</label><input class="input" name="email" type="email" placeholder="wewe@mfano.co.tz" required></div>
      <div class="two-col">
        <div class="field"><label>Namba ya simu</label><input class="input" name="phone_number" placeholder="07xx xxx xxx"></div>
        <div class="field"><label>Mkoa / Eneo</label><input class="input" name="location_region" placeholder="Mbeya"></div>
      </div>
      <div class="field"><label>Aina ya mtumiaji</label>
        <select class="input" name="role">
          <option value="farmer">🌱 Mkulima</option>
          <option value="buyer">🥔 Mnunuzi wa Viazi</option>
        </select>
        <p class="tiny" style="margin-top:5px;">Admin hawezi kujisajiliwa hadharani; akaunti yake inadhibitiwa na mfumo/Admin.</p>
      </div>
      <div class="field"><label>Nenosiri</label><input class="input" name="password" type="password" placeholder="Angalau herufi 8" required minlength="6"></div>
      ${state.formErr ? `<div class="err-text">${esc(state.formErr)}</div>` : ''}
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:6px;" ${state.busy?'disabled':''}>
        ${state.busy?'<span class="spin"></span>':''} Jisajili
      </button>
    </form>
    <p class="tiny" style="text-align:center;margin-top:16px;">Tayari una akaunti? <a class="link" onclick="state.authTab='login';render()">Ingia</a></p>
  `;
}
function settingsSheet(){
  const open = state.sheet==='settings';
  return `

function backendStatusBanner(){
  const mode = state.backendMode;
  if(mode==='real'){
    return `<div class="note-box" style="border-color:var(--primary);"><span style="font-size:18px;">🟢</span><div><b>Umeunganishwa na Seva Halisi</b><br>Akaunti, mashamba, uchunguzi wa AI na soko vinahifadhiwa kwenye seva (<code>${esc(state.aiBackendUrl)}</code>) — vinaonekana kwenye vifaa vyote vinavyounganishwa nayo.</div></div>`;
  }
  if(mode==='local'){
    return `<div class="note-box" style="border-color:var(--accent);"><span style="font-size:18px;">🟡</span><div><b>Modi ya Ndani (Offline)</b><br>Seva (<code>${esc(state.aiBackendUrl)}</code>) haikupatikana kwenye kikao hiki. Data inahifadhiwa kwenye kifaa hiki pekee. Hakikisha backend inaendesha kisha ubadilishe anwani hapo chini na uunganishe upya.</div></div>`;
  }
  return `<div class="note-box">${ic.info}<div>Bado hujaunganishwa na seva yoyote kwenye kikao hiki.</div></div>`;
}
async function saveAiBackendUrl(){
  const val = (document.getElementById('ai_backend_url').value||'').trim() || 'http://127.0.0.1:8000';
  state.aiBackendUrl = val;
  state.backendMode = null; // jaribu tena kuunganisha kutoka mwanzo
  await LS.set('config:aiBackendUrl', val);
  showToast('Anwani imehifadhiwa. Tunaunganisha upya...');
  closeSheet();
  goTab(state.tab);
}
async function resetAllData(){
  try{
    const email = state.user && state.user.email;
    if(email){
      const ids = (await LS.get('farms_by:'+email))||[];
      for(const id of ids){ await LS.del('farm:'+id); await LS.del('cycles:'+id); await LS.del('activities:'+id); await LS.del('expenses:'+id); await LS.del('scans:'+id); }
      await LS.del('farms_by:'+email);
      await LS.del('user:'+email);
    }
  }catch(e){}
  logout();
  showToast('Data zote zimefutwa.');
}

function scanListItem(s, border){
  const meta = DISEASE_LABELS[s.predicted_class] || {label:s.predicted_class, tone:'grey'};
  return `<div class="list-item" style="${border?'':'border-bottom:none;'}">
    <div class="list-ico ${meta.tone==='danger'?'':''}" style="${toneBg(meta.tone)}">${diseaseIcon(meta.tone)}</div>
    <div class="list-main">
      <div class="list-title">${esc(meta.label)}</div>
      <div class="list-sub">${esc(s.farmName||'')} · ${fmtDate(s.created_at)}</div>
    </div>
    <div class="list-end">${Math.round(s.confidence*100)}%</div>
  </div>`;
}
function toneBg(tone){
  const map={healthy:'background:var(--primary-tint);color:var(--primary-dark);',warn:'background:var(--accent-tint);color:#8A5A1F;',danger:'background:var(--danger-tint);color:var(--danger);',grey:'background:var(--grey-tint);color:var(--ink-soft);'};
  return map[tone]||map.grey;
}
function diseaseIcon(tone){
  if(tone==='healthy') return ic.check;
  if(tone==='danger') return ic.alert;
  if(tone==='warn') return ic.alert;
  return ic.leaf;
}
function farmListItem(f, border){
  const thumb = f.photo

    : `<div class="list-ico" style="width:44px;height:44px;border-radius:12px;">${ic.farm}</div>`;
  return `<div class="list-item" style="${border?'':'border-bottom:none;'}cursor:pointer;" onclick="openFarm('${f.id}')">
    ${thumb}
    <div class="list-main">
      <div class="list-title">${esc(f.name)}</div>
      <div class="list-sub">${esc(f.region||'Eneo halijawekwa')}${f.size_acres?' · '+f.size_acres+' ekari':''}</div>

function stageTrack(stage){
  const idx = STAGE_ORDER.indexOf(stage);
  return `<div class="stage-track">
    ${STAGE_ORDER.map((s,i)=>`
      <div class="stage-node ${i<idx?'done':''} ${i===idx?'now':''}"></div>
      ${i<STAGE_ORDER.length-1?`<div class="stage-seg ${i<idx?'done':''}"></div>`:''}
    `).join('')}
  </div>
  <div class="tiny" style="margin-top:6px;">${STAGE_LABELS[stage]||stage}</div>`;
}

async function pickActivityPhoto(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Chagua faili la picha.', true); return; }
  if(file.size > 4*1024*1024){ showToast('Picha ni kubwa mno (zaidi ya 4MB).', true); return; }
  try{ state.actFormPhoto = await fileToDataURL(file); render(); }
  catch(e){ showToast(e.message||'Imeshindwa kupakia picha.', true); }
}

function openLightbox(src){
  closeLightbox();
  const div = document.createElement('div');
  div.id = 'lightbox';
  div.style.cssText = 'position:fixed;inset:0;background:rgba(15,17,10,.9);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;';
  div.innerHTML = `<img src="${src}" style="max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;">`;
  div.onclick = closeLightbox;
  document.body.appendChild(div);
}
function closeLightbox(){
  const el = document.getElementById('lightbox');
  if(el) el.remove();
}

function diseaseRecommendationCard(predictedClass){
  const rec = DISEASE_RECOMMENDATIONS[predictedClass];
  if(!rec) return '';
  const meta = DISEASE_LABELS[predictedClass] || {tone:'grey'};

function renderMarket(){
